<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>孟娴！你的脑回路掉出来了</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#ffecf2;color:#25172c;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;display:flex;justify-content:center}
main{width:min(760px,100%)}h1{font-size:clamp(24px,6vw,40px);line-height:1.12;margin:6px 0;text-align:center;transform:rotate(-1deg)}.sub{text-align:center;margin:8px 0 12px;font-weight:700}
canvas{display:block;width:100%;height:auto;border:4px solid #25172c;border-radius:16px;background:#b9f7e5;touch-action:none;box-shadow:6px 7px 0 #25172c}
.stats{display:flex;justify-content:space-between;gap:8px;margin:12px 0;font-weight:900}.pill{background:#fff;border:3px solid #25172c;border-radius:12px;padding:7px 10px;box-shadow:3px 3px 0 #25172c}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.group{display:flex;gap:8px}button{font:inherit;font-weight:900;border:3px solid #25172c;border-radius:13px;background:#ffdb4d;padding:12px 17px;box-shadow:4px 4px 0 #25172c;color:#25172c;touch-action:manipulation}button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #25172c}.hint{text-align:center;font-size:12px;margin:12px 0;line-height:1.6}.overlay{position:relative}.modal{position:absolute;inset:0;border-radius:12px;background:#fff4f0ed;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.modal h2{font-size:clamp(24px,5vw,36px);margin:0 0 8px}.modal p{line-height:1.7;font-weight:700;max-width:440px}.modal button{background:#ff8ac0}
</style></head><body><main>
<h1>🧠 孟娴！你的脑回路掉出来了</h1>
<p class="sub">一款毫无意义但很有必要的游戏</p>
<div class="stats"><span class="pill" id="score">🧠 脑回路：0/8</span><span class="pill" id="lives">🥔 理智值：3</span></div>
<div class="overlay"><canvas id="game" width="720" height="420"></canvas><div class="modal" id="modal"><h2>紧急通知！</h2><p>孟娴的脑回路散落在宇宙各地！<br>快操纵一颗会走路的土豆，把它们捡回来。<br><br>温馨提示：本游戏没有任何科学依据。</p><button id="start">开始胡闹</button></div></div>
<div class="controls"><div class="group"><button id="left">⬅ 左拐</button><button id="right">右拐 ➡</button></div><button id="jump">🦵 原地起飞</button></div>
<p class="hint">电脑：← → 移动，空格跳跃。手机：按住左右键，点击起飞。<br>友情提醒：土豆不具备飞行资格，请勿模仿。</p>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=720,H=420,modal=document.getElementById('modal');
let p,items,baddies,score,lives,active=false,frame=0,keys={};
const platforms=[{x:0,y:365,w:720,h:55},{x:95,y:295,w:115,h:13},{x:270,y:245,w:110,h:13},{x:465,y:300,w:125,h:13}];
const silly=['孟娴的脑回路 +1','检测到可爱，系统宕机','土豆：我是谁我在哪','恭喜！你暂时没在发疯','宇宙批准你摸鱼 3 秒','这颗星星是咸鱼味的','前方出现一只会开会的鸭','理智正在加载……'];
function reset(){p={x:35,y:320,w:30,h:38,vy:0,on:false,inv:0};items=[{x:135,y:265},{x:175,y:265},{x:300,y:215},{x:350,y:215},{x:500,y:270},{x:550,y:270},{x:625,y:335},{x:250,y:335}].map((a,i)=>({...a,t:false,i}));baddies=[{x:220,y:337,v:1.7,emoji:'🦆'},{x:420,y:337,v:-1.5,emoji:'🧦'},{x:590,y:337,v:1.3,emoji:'🥒'}];score=0;lives=3;frame=0;hud();}
function hud(){document.getElementById('score').textContent=`🧠 脑回路：${score}/8`;document.getElementById('lives').textContent=`🥔 理智值：${lives}`;}
function box(a,b,w,h,color){x.fillStyle=color;x.fillRect(a,b,w,h)}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a5f3fc');g.addColorStop(1,'#fbcfe8');x.fillStyle=g;x.fillRect(0,0,W,H);
 // absurd sky
 x.font='30px sans-serif';x.fillText('🍕',38,75);x.fillText('🛸',600,95);x.fillText('🐟',520,55);x.fillText('☁️',200,90);x.fillText('☁️',400,65);
 x.fillStyle='#ff8ac0';x.beginPath();x.ellipse(570,165,75,20,0,0,Math.PI*2);x.fill();x.fillStyle='#25172c';x.font='bold 17px sans-serif';x.textAlign='center';x.fillText('孟娴快乐研究所',570,170);
 x.fillStyle='#68d391';x.fillRect(0,365,720,55);x.fillStyle='#25172c';x.fillRect(0,365,720,5);
 platforms.slice(1).forEach(q=>{x.fillStyle='#25172c';x.fillRect(q.x,q.y,q.w,q.h);x.fillStyle='#ffdb4d';x.fillRect(q.x+3,q.y+3,q.w-6,5)});
 items.forEach(s=>{if(!s.t){x.save();x.translate(s.x,s.y+Math.sin(frame*.08+s.i)*3);x.rotate(Math.sin(frame*.05)*.15);x.font='24px sans-serif';x.textAlign='center';x.fillText(['🧠','🧠','💡','🧠','🌀','🧠','💭','🧠'][s.i],0,8);x.restore()}});
 baddies.forEach(e=>{x.font='30px sans-serif';x.textAlign='center';x.fillText(e.emoji,e.x+15,e.y+27);});
 // potato hero
 x.font='32px sans-serif';x.textAlign='center';if(p.inv%2===0||!p.inv)x.fillText('🥔',p.x+15,p.y+30);
 x.textAlign='center';x.font='bold 23px sans-serif';x.fillStyle='#25172c';x.fillText('孟 娴',360,130);x.font='bold 14px sans-serif';x.fillText('宇宙级快乐（未经认证）',360,151);
 x.font='13px sans-serif';x.fillText('← 这里没有逻辑，只有土豆 →',360,400);
}
function hit(a,b){return a.x<b.x+25&&a.x+a.w>b.x-10&&a.y<b.y+28&&a.y+a.h>b.y-8}
function bonk(){lives--;p.x=30;p.y=310;p.vy=0;p.inv=90;hud();if(lives<=0){active=false;end(false)}}
function update(){if(!active)return;frame++;p.x+=((keys.l?-3.5:0)+(keys.r?3.5:0));p.x=Math.max(0,Math.min(W-p.w,p.x));p.vy+=.5;p.y+=p.vy;p.on=false;
for(const q of platforms){if(p.vy>=0&&p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<q.y+18){p.y=q.y-p.h;p.vy=0;p.on=true}}
if(p.y>H)bonk();if(p.inv>0)p.inv--;
baddies.forEach(e=>{e.x+=e.v;if(e.x<0||e.x>690)e.v*=-1;if(!p.inv&&hit(p,{x:e.x,y:e.y,w:30,h:28}))bonk()});
items.forEach(s=>{if(!s.t&&hit(p,{x:s.x-8,y:s.y-8,w:20,h:20})){s.t=true;score++;hud();toast(silly[(score-1)%silly.length]);if(score===8){active=false;end(true)}}});
}
let toastUntil=0;function toast(t){toastUntil=frame+65;window.toastText=t}
function end(win){modal.style.display='flex';modal.innerHTML=win?'<h2>🏆 孟娴，快乐已超标！</h2><p>你成功集齐 8 条脑回路！<br>系统结论：你值得快乐，土豆值得加薪，鸭子应该停止开会。<br><br>愿你今天的烦恼像 Wi-Fi 一样——看着有，实际上连不上。</p><button id="again">再胡闹一次</button>':'<h2>🥔 土豆暂时下线</h2><p>没关系，理智这种东西，本来就不是必需品。<br>再来一次，把脑回路捡回来！</p><button id="again">重启土豆</button>';document.getElementById('again').onclick=start;}
function start(){reset();active=true;modal.style.display='none';}
function loop(){update();draw();if(window.toastText&&frame<toastUntil&&active){x.fillStyle='#fff';x.strokeStyle='#25172c';x.lineWidth=3;x.beginPath();x.roundRect(130,175,460,48,12);x.fill();x.stroke();x.fillStyle='#25172c';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText(window.toastText,360,205)}requestAnimationFrame(loop)}
function jump(){if(active&&p.on){p.vy=-10.5;p.on=false}}
document.getElementById('start').onclick=start;document.getElementById('jump').onclick=jump;
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
bind('left','l');bind('right','r');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key===' '||e.key==='ArrowUp')jump()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
reset();draw();loop();
</script></body></html>
